<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wチャンス QRコード発行</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--ink:#1b2140;--pink:#ff2f92;--gold:#ffe14d;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink);background:#fff3f9}
header{background:linear-gradient(90deg,#ff2f92,#a02bd8);color:#fff;padding:16px 18px}
header h1{margin:0;font-size:20px}
header p{margin:4px 0 0;font-size:13px;opacity:.9}
main{max-width:920px;margin:0 auto;padding:16px}
.card{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:3px 3px 0 var(--ink)}
.card h2{margin:0 0 10px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}
input[type=text],input[type=number],input[type=password]{width:100%;padding:9px 10px;border:2px solid var(--ink);border-radius:8px;font-size:15px;background:#fff;color:var(--ink)}
.full{grid-column:1/-1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
button{font:inherit;font-weight:800;padding:11px 16px;border-radius:999px;border:2px solid var(--ink);background:var(--gold);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
button.sub{background:#fff}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button:disabled{opacity:.5}
.hint{font-size:12px;color:#555;margin:6px 0 0;line-height:1.5}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.chip{padding:4px 10px;border-radius:999px;border:2px solid var(--ink);font-weight:800;font-size:13px;background:#fff}
.msg{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:700}
.ok{background:#e6ffe9;border:2px solid #2e9d49}.ng{background:#ffe6e6;border:2px solid #d33}.wait{background:#fffbe0;border:2px solid #c9a400}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.t{border:2px solid var(--ink);border-radius:10px;padding:8px;text-align:center;background:#fff}
.t img{width:100%;height:auto;display:block;image-rendering:pixelated}
.t .no{font-weight:800;margin:4px 0}
.t .r{display:none;font-size:12px;font-weight:800}
.show .t .r{display:block}
.t button{padding:6px 10px;font-size:12px;box-shadow:0 2px 0 var(--ink)}
</style>
</head>
<body>
<header><h1>Wチャンス QRコード発行</h1><p>くじ1枚ごとの固有QRを作り、PNGで保存します。</p></header>
<main>
<div class="card">
  <h2>発行の設定</h2>
  <div class="grid">
    <div><label for="n">発行する枚数</label><input type="number" id="n" value="25" min="1" max="1000"></div>
    <div><label for="st">開始番号</label><input type="number" id="st" value="1" min="1"></div>
  </div>
  <h2 style="margin-top:14px">当たりの内訳(1セットあたり)</h2>
  <div class="grid">
    <div><label for="c_horse">馬 3つ揃い</label><input type="number" id="c_horse" value="3" min="0"></div>
    <div><label for="c_deer">鹿 3つ揃い</label><input type="number" id="c_deer" value="3" min="0"></div>
    <div><label for="c_hidaka">日髙 3つ揃い</label><input type="number" id="c_hidaka" value="1" min="0"></div>
    <div><label for="c_lose">ハズレ</label><input type="number" id="c_lose" value="18" min="0"></div>
  </div>
  <p class="hint" id="setinfo"></p>
  <p class="hint">25枚を超えるときは、25枚ごとにこの内訳どおりに作ります。端数の枚数は、その1セットからランダムに選びます。</p>
  <div class="grid" style="margin-top:14px">
    <div class="full"><label for="url">スロットのURL</label><input type="text" id="url" value="https://torutexiya.github.io/umashika-wchance/"></div>
    <div class="full"><label for="gas">GAS のURL(ウェブアプリのURL)</label><input type="text" id="gas" value="https://script.google.com/macros/s/AKfycbwVcd0tK3o59suPrO2KNlIX-G11UbtIv9-jWEEn6ABs0cdhc5es0AFgY8BYfJuVPHuG/exec" placeholder="https://script.google.com/macros/s/.../exec"></div>
    <div class="full"><label for="key">管理キー</label><input type="password" id="key" autocomplete="off" placeholder="GAS のスクリプトプロパティ ADMIN_KEY と同じもの"></div>
  </div>
  <p class="hint">GAS のURLと管理キーを入れると、発行と同時にスプレッドシートへ登録します。登録されていないQRは、スロットで使えません。</p>
  <label style="margin-top:10px;font-weight:600"><input type="checkbox" id="shownum" checked> PNGのQRの下に番号(No.001)を入れる</label>
  <div class="row"><button id="go">QRコードを発行する</button></div>
  <div id="status"></div>
</div>

<div class="card" id="out" hidden>
  <h2>発行結果</h2>
  <div class="sum" id="sum"></div>
  <div class="row">
    <button id="zip">全部をZIPで保存(PNG)</button>
    <button class="sub" id="csv">一覧をCSVで保存</button>
    <label style="margin:0;font-weight:600"><input type="checkbox" id="showres"> 画面に結果を表示する</label>
  </div>
  <p class="hint">結果の一覧は、運営側の確認用です。印刷するPNGには、結果は入りません。</p>
  <div id="list" style="margin-top:12px"></div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const KEYS=['horse','deer','hidaka','lose'];
const LABEL={horse:'馬',deer:'鹿',hidaka:'日髙',lose:'ハズレ'};
const IDX={horse:0,deer:1,hidaka:2};
const ALPHA='abcdefghjkmnpqrstuvwxyz23456789';
const rnd=n=>{const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%n};
const token=()=>{let s='';for(let i=0;i<18;i++)s+=ALPHA[rnd(ALPHA.length)];return s};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
function loseReels(){
  let a=[rnd(3),rnd(3),rnd(3)];
  if(rnd(2)){const v=rnd(3),o=(v+1+rnd(2))%3;a=shuffle([v,v,o])}
  if(a[0]===a[1]&&a[1]===a[2])a[2]=(a[2]+1)%3;
  return a;
}
const counts=()=>Object.fromEntries(KEYS.map(k=>[k,Math.max(0,parseInt($('c_'+k).value)||0)]));
const setInfo=()=>{const c=counts(),t=KEYS.reduce((s,k)=>s+c[k],0);$('setinfo').textContent=`1セット = ${t}枚(馬${c.horse}・鹿${c.deer}・日髙${c.hidaka}・ハズレ${c.lose})`};
KEYS.forEach(k=>$('c_'+k).addEventListener('input',setInfo));setInfo();

function makeTickets(n,start,c){
  const block=[];KEYS.forEach(k=>{for(let i=0;i<c[k];i++)block.push(k)});
  const res=[];
  while(res.length<n){for(const r of shuffle(block.slice())){if(res.length<n)res.push(r)}}
  const used=new Set();
  return res.map((r,i)=>{let t;do{t=token()}while(used.has(t));used.add(t);
    const v=IDX[r];
    return {no:String(start+i).padStart(3,'0'),token:t,result:r,reels:r==='lose'?loseReels():[v,v,v]};
  });
}
function qrCanvas(text,no,withNo){
  const qr=qrcode(0,'M');qr.addData(text);qr.make();
  const n=qr.getModuleCount(),cell=12,q=4,size=(n+q*2)*cell,extra=withNo?64:0;
  const c=document.createElement('canvas');c.width=size;c.height=size+extra;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(qr.isDark(r,k))x.fillRect((k+q)*cell,(r+q)*cell,cell,cell);
  if(withNo){x.fillStyle='#000';x.font='bold 36px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('No.'+no,size/2,size+extra/2-8)}
  return c;
}
const blob=c=>new Promise(r=>c.toBlob(r,'image/png'));
const save=(b,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
const msg=(t,cls)=>{$('status').innerHTML=`<div class="msg ${cls}">${t}</div>`};
let TK=[],CV=[];

$('go').onclick=async()=>{
  const n=Math.max(1,Math.min(1000,parseInt($('n').value)||0)),st=Math.max(1,parseInt($('st').value)||1);
  const c=counts(),total=KEYS.reduce((s,k)=>s+c[k],0);
  if(!total){msg('当たりの内訳が0枚です。','ng');return}
  const base=$('url').value.trim().replace(/[?#].*$/,'');
  if(!/^https?:\/\//.test(base)){msg('スロットのURLを入れてください。','ng');return}
  $('go').disabled=true;
  TK=makeTickets(n,st,c);
  CV=TK.map(t=>qrCanvas(`${base}?t=${t.token}`,t.no,$('shownum').checked));
  render();
  const gas=$('gas').value.trim(),key=$('key').value;
  if(gas&&key){
    msg('スプレッドシートへ登録しています…','wait');
    try{
      const r=await fetch(gas,{method:'POST',body:JSON.stringify({action:'register',key,tickets:TK.map(t=>({no:t.no,token:t.token,result:t.result,reels:t.reels.join(',')}))})});
      const j=await r.json();
      if(j.ok)msg(`${j.count}枚を登録しました。PNGを保存して印刷できます。`,j.count===TK.length?'ok':'wait');
      else msg(`登録できませんでした(${j.error})。管理キーとGASの設定を確認してください。このQRは、まだスロットで使えません。`,'ng');
    }catch(e){msg('登録の通信に失敗しました。GASのURLを確認してください。このQRは、まだスロットで使えません。','ng')}
  }else msg('GASのURLか管理キーが空のため、スプレッドシートには登録していません。CSVを保存して、手動で登録することもできます。','wait');
  $('go').disabled=false;
};
function render(){
  $('out').hidden=false;
  const cnt={};TK.forEach(t=>cnt[t.result]=(cnt[t.result]||0)+1);
  $('sum').innerHTML=`<span class="chip">合計 ${TK.length}枚</span>`+KEYS.map(k=>`<span class="chip">${LABEL[k]} ${cnt[k]||0}</span>`).join('');
  const L=$('list');L.innerHTML='';
  TK.forEach((t,i)=>{
    const d=document.createElement('div');d.className='t';
    const img=new Image();img.src=CV[i].toDataURL('image/png');img.alt='No.'+t.no;
    d.appendChild(img);
    d.insertAdjacentHTML('beforeend',`<div class="no">No.${t.no}</div><div class="r">${LABEL[t.result]}</div>`);
    const b=document.createElement('button');b.textContent='PNG保存';
    b.onclick=async()=>save(await blob(CV[i]),`w-chance-${t.no}.png`);
    d.appendChild(b);L.appendChild(d);
  });
}
$('showres').onchange=e=>$('list').parentElement.classList.toggle('show',e.target.checked);
$('zip').onclick=async()=>{
  $('zip').disabled=true;
  const z=new JSZip();
  for(let i=0;i<TK.length;i++)z.file(`w-chance-${TK[i].no}.png`,await blob(CV[i]));
  save(await z.generateAsync({type:'blob'}),'w-chance-qr.zip');
  $('zip').disabled=false;
};
$('csv').onclick=()=>{
  const base=$('url').value.trim().replace(/[?#].*$/,'');
  const rows=[['no','token','result','reels','url']].concat(TK.map(t=>[t.no,t.token,t.result,t.reels.join(','),`${base}?t=${t.token}`]));
  save(new Blob(['\ufeff'+rows.map(r=>r.map(v=>`"${v}"`).join(',')).join('\n')],{type:'text/csv'}),'w-chance-tickets.csv');
};
</script>
</body>
</html>
