<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wチャンススロット（演出デモ）</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2140;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;margin:0;color:#fffaf0;font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif}
body{background:radial-gradient(circle at 50% 30%,transparent 0 18%,#3a0a5e 78%),repeating-conic-gradient(from 0deg at 50% 30%,#ff2f92 0 8deg,#ff7ac0 8deg 16deg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(#ffe14d 3px,transparent 4px),radial-gradient(#33e0ff 2.5px,transparent 3.5px);background-size:46px 46px,70px 70px;background-position:0 0,23px 31px}
main{--mh:min(calc(100dvh - 180px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),calc((100vw - 28px)*450/270),640px);position:relative;max-width:430px;height:100%;margin:0 auto;padding:8px 14px 8px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.snd{position:absolute;top:6px;right:8px;z-index:6;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);background:#fffaf0;color:var(--ink);padding:5px;cursor:pointer}
.snd svg{width:100%;height:100%;display:block}
.snd[aria-pressed=false] #wave{display:none}
.stage{display:flex;justify-content:center;flex:none}
.machine{position:relative;flex:none;width:calc(var(--mh)*270/450);aspect-ratio:270/450;container-type:inline-size}
.art{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 5px 0 #0004)}
.b{fill:#ffd23a;animation:bl .6s steps(1) infinite}
.b:nth-child(even){animation-delay:.3s}
@keyframes bl{50%{opacity:.3}}
.lamp{fill:#ffc53a}
.machine.win .b{animation-duration:.2s}
.machine.win .lamp{animation:lamp .25s steps(1) infinite alternate}
.machine.win .l2{animation-delay:.25s}
@keyframes lamp{from{fill:#ffe14d}to{fill:#ff2f92}}
.machine.flash{animation:flash .3s steps(2) 7}
@keyframes flash{50%{filter:brightness(1.35)}}
.mq{position:absolute;left:44.4%;top:18.22%;transform:translate(-50%,-50%);white-space:nowrap;font-family:"Dela Gothic One",sans-serif;font-size:8.6cqw;color:#ffe14d;text-shadow:0 0 6px #ff2f92,0 0 14px #ff2f92,2px 2px 0 #b0005f}
.reels{position:absolute;left:10%;top:32.44%;width:68.89%;height:31.1cqw;display:flex;gap:1.2cqw}
.reels::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.28) 0 14%,transparent 14%)}
.reel{flex:1;height:100%;overflow:hidden;background:#fffaf0;border-radius:3px;box-shadow:inset 0 10px 10px #0004,inset 0 -10px 10px #0004}
.strip{will-change:transform}
.strip.spin{filter:blur(2.2px)}
.cell{height:31.1cqw;display:flex;align-items:center;justify-content:center}
.cell svg{width:88%;height:auto;max-height:92%;aspect-ratio:1}
.lever{position:absolute;left:88.1%;top:49.56%;width:0;height:0;z-index:3}
.pv{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#aaa 60%,#666);border:2px solid #555;z-index:2}
.arm{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;z-index:3;cursor:grab;touch-action:none}
.arm:focus-visible{outline:none}
.arm:focus-visible .ball{outline:3px solid #fff;outline-offset:2px}
.shaft{position:absolute;left:-4px;top:-28px;width:8px;height:28px;background:linear-gradient(90deg,#777,#fff 45%,#777);border:2px solid #555;border-radius:4px}
.ball{position:absolute;left:-17px;top:-56px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9aa8,#d8132f 55%,#7a0618);border:3px solid #7a0618;box-shadow:0 3px 0 #0006;touch-action:none}
.bottom{position:relative;flex:1;min-height:0}
.chara{position:absolute;bottom:0;width:76px;display:flex;flex-direction:column;align-items:center;transform-origin:50% 100%}
#cl{left:0}#cr{right:0}
.chara svg{width:auto;height:clamp(80px,15dvh,106px);aspect-ratio:100/140;overflow:visible;display:block;filter:url(#paint) drop-shadow(0 3px 0 #0004);animation:bob 2.4s ease-in-out infinite}
.bubble{position:absolute;bottom:100%;margin-bottom:8px;width:76px;background:#fff;color:var(--ink);border:3px solid var(--ink);font-size:11px;font-weight:900;line-height:1.3;padding:5px 6px;border-radius:12px;box-shadow:2px 2px 0 var(--ink);z-index:4}
.bubble::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-6px;border:6px solid transparent;border-top:8px solid var(--ink);border-bottom:0}
#result{position:absolute;left:0;right:0;top:2px;display:flex;flex-direction:column;align-items:center;font-family:"Dela Gothic One","Zen Maru Gothic",sans-serif;font-size:min(clamp(30px,6dvh,48px),calc((100vw - 184px)/5));line-height:1.1;color:#ffe14d;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 #b0005f,0 0 24px #ff2f92}
#result small{display:inline-block;max-width:calc(100vw - 184px);margin-top:8px;font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:clamp(14px,2.3dvh,18px);line-height:1.35;color:var(--ink);background:linear-gradient(#ffe46b,#f5a300);border:3px solid var(--ink);border-radius:18px;padding:5px 14px;text-shadow:none;-webkit-text-stroke:0;box-shadow:0 3px 0 #a66400}
#result.lose{color:#fff;text-shadow:3px 3px 0 #3a0a5e}
#result.lose small{background:#fffaf0;box-shadow:none}
.win{animation:pop .6s,glow .9s .6s infinite alternate}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes glow{to{filter:drop-shadow(0 0 14px #ffe14d)}}
.shake{animation:shake .12s infinite}
.hop{animation:hop .35s infinite alternate ease-in-out}
.hop2{animation-delay:.17s}
@keyframes shake{50%{transform:translateX(2px) rotate(.4deg)}}
@keyframes hop{to{transform:translateY(-8px) rotate(-4deg)}}
@keyframes bob{50%{transform:translateY(-3px)}}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
#fx i{position:absolute;top:-16px;width:9px;height:14px;animation:fall linear forwards}
#fx .fxm{position:absolute;top:-44px;width:34px;height:34px;animation:fall linear forwards}
@keyframes fall{to{top:105%}}
@media (prefers-reduced-motion:reduce){.shake,.win,.hop,.machine.flash,.b,.machine.win .lamp,#fx i,#fx .fxm,.chara svg{animation:none}}
.machine[data-hit="0"] .row0,.machine[data-hit="1"] .row1,.machine[data-hit="2"] .row2{animation:rowhit .3s steps(1) infinite alternate}
@keyframes rowhit{from{fill:#fbe0e0}to{fill:#ffe14d}}
@media (prefers-reduced-motion:reduce){.machine[data-hit] .row{animation:none}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:4;max-width:430px;margin:0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(#5a1a7e,#2e0a52);border-top:4px solid #ffe14d;border-radius:22px 22px 0 0;box-shadow:0 -8px 30px #000a;text-align:center;visibility:hidden;transform:translateY(110%);transition:transform .45s cubic-bezier(.2,1.2,.3,1),visibility 0s .45s}
.sheet.open{visibility:visible;transform:none;transition:transform .45s cubic-bezier(.2,1.2,.3,1)}
.s-title{font-family:"Dela Gothic One",sans-serif;font-size:38px;line-height:1.1;color:#ffe14d;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 #b0005f,0 0 20px #ff2f92}
.s-prize{display:inline-block;margin-top:6px;background:#fffaf0;color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:4px 14px;font-weight:900;font-size:14px;box-shadow:0 3px 0 #0006}
.steps{margin:10px 0 0;padding:8px 12px;background:#ffffff1f;border:2px dashed #ffe14d;border-radius:14px;text-align:left}
.steps h2{margin:0 0 4px;font-size:13px;color:#ffe14d;text-align:center}
.steps ol{margin:0;padding:0;list-style:none;font-weight:900;font-size:15px;line-height:1.7}
.steps li{display:flex;align-items:center;gap:8px}
.steps b{flex:none;width:22px;height:22px;border-radius:50%;background:#ffe14d;color:var(--ink);font-size:13px;line-height:22px;text-align:center}
.cta{display:block;margin-top:10px;padding:14px;border-radius:999px;background:linear-gradient(#ffe46b,#f5a300);color:var(--ink);border:3px solid var(--ink);font-family:"Dela Gothic One",sans-serif;font-size:19px;text-decoration:none;box-shadow:0 5px 0 #a66400}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 #a66400}
.cta:focus-visible,.s-close:focus-visible{outline:3px solid #fff;outline-offset:2px}
.s-close{position:absolute;top:8px;right:10px;background:none;border:0;color:#fff8;font-size:12px;cursor:pointer;padding:6px}
@media (prefers-reduced-motion:reduce){.sheet,.sheet.open{transition:none}}
.pop{position:fixed;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;pointer-events:none;visibility:hidden;opacity:0}
.pop.show{visibility:visible;animation:fadeup 1.6s ease-out forwards}
@keyframes fadeup{from{opacity:0;transform:translateY(28px) scale(.88)}to{opacity:1;transform:none}}
.pframe{position:relative;width:min(60vw,270px);aspect-ratio:1;border:6px solid #fff;border-radius:24px;box-shadow:0 12px 32px #000a,0 0 0 4px #ff2f92;transform:rotate(-3deg);pointer-events:auto;cursor:pointer;animation:float 3.2s 1.6s ease-in-out infinite}
.pframe img{display:block;width:100%;height:100%;object-fit:cover;border-radius:18px}
@keyframes float{50%{transform:rotate(-3deg) translateY(-8px)}}
.pbub{position:absolute;left:40%;top:60%;white-space:nowrap;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:6px 11px;font-weight:900;font-size:clamp(14px,4.2vw,18px);box-shadow:2px 3px 0 var(--ink);transform:rotate(3deg)}
.pbub::before{content:"";position:absolute;left:16px;top:-11px;border:6px solid transparent;border-bottom:9px solid var(--ink);border-top:0}
.pop.show .pbub{animation:bubpop .45s 1s backwards}
@keyframes bubpop{0%{transform:scale(0) rotate(3deg)}70%{transform:scale(1.15) rotate(3deg)}100%{transform:scale(1) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.pop.show,.pframe,.pop.show .pbub{animation:none}.pop.show{opacity:1}}
.note{margin-top:10px;padding:9px 12px;background:#ffffff1f;border:2px dashed #ffe14d;border-radius:14px;font-weight:900;font-size:16px}
.note b{color:#ffe14d;font-size:21px;margin-right:2px}
.show{margin-top:10px;padding:14px 10px;border-radius:999px;background:linear-gradient(#ffe46b,#f5a300);color:var(--ink);border:3px solid var(--ink);font-family:"Dela Gothic One",sans-serif;font-size:19px;box-shadow:0 5px 0 #a66400}
.s-sub{margin-top:6px;font-weight:900;font-size:15px;color:#fff}
</style>
</head>

<script>
/* ▼ GAS をデプロイしたら、ウェブアプリのURLをここに貼る */
const CONFIG={GAS_URL:'https://script.google.com/macros/s/AKfycbwVcd0tK3o59suPrO2KNlIX-G11UbtIv9-jWEEn6ABs0cdhc5es0AFgY8BYfJuVPHuG/exec'};
const $=id=>document.getElementById(id);
const ID=['horse','deer','hidaka'];
const K=14;let CH=100;
const PRIZE=[['馬が3つ揃い！','フード（300均一）1品ゲット'],['鹿が3つ揃い！','ドリンク一杯ゲット'],['日髙が3つ揃い！','劇団メンバーに一杯奢り！']];
const reels=[...Array(3)].map(()=>{
  const r=document.createElement('div');r.className='reel';
  const s=document.createElement('div');s.className='strip';
  for(let i=0;i<K*3;i++){const c=document.createElement('div');c.className='cell';c.innerHTML=`<svg viewBox="0 0 100 100"><use href="#${ID[i%3]}"/></svg>`;s.appendChild(c)}
  r.appendChild(s);$('reels').appendChild(r);
  return {s,pos:Math.floor(Math.random()*3)};
});
const place=(r,p,anim,dur)=>{r.s.style.transition=anim?`transform ${dur}ms cubic-bezier(.15,.85,.2,1)`:'none';r.s.style.transform=`translateY(${-p*CH}px)`};
const fit=()=>{CH=reels[0].s.parentElement.clientHeight;reels.forEach(r=>place(r,r.pos,false))};fit();addEventListener('resize',fit);
function pick(){
  if(Math.random()<.6){
    let a=[0,1,2].map(()=>Math.floor(Math.random()*3));
    if(Math.random()<.5){const v=Math.floor(Math.random()*3);a=[v,v,(v+1+Math.floor(Math.random()*2))%3]}
    if(a[0]===a[1]&&a[1]===a[2])a[2]=(a[2]+1)%3;return a}
  const v=Math.floor(Math.random()*3);return[v,v,v];
}
const say=(l,r)=>{$('bl').textContent=l;$('br').textContent=r};
const hop=on=>{$('cl').classList.toggle('hop',on);$('cr').classList.toggle('hop',on);$('cr').classList.toggle('hop2',on)};
function confetti(){const c=$('fx');for(let i=0;i<46;i++){const p=document.createElement('i');p.style.cssText=`left:${Math.random()*100}%;background:${['#ffe14d','#33e0ff','#ff2f92','#fff','#7cff6b'][i%5]};animation-delay:${Math.random()*.4}s;animation-duration:${1.4+Math.random()*1.2}s;transform:rotate(${Math.random()*360}deg)`;c.appendChild(p)}setTimeout(()=>c.innerHTML='',3400)}
function mugs(){const c=$('fx');for(let i=0;i<24;i++){const m=document.createElement('div');m.className='fxm';m.style.cssText=`left:${Math.random()*92}%;animation-delay:${Math.random()*.9}s;animation-duration:${1.8+Math.random()*1.4}s;transform:rotate(${-30+Math.random()*60}deg)`;m.innerHTML='<svg viewBox="0 0 100 100" width="100%" height="100%"><use href="#mug"/></svg>';c.appendChild(m)}setTimeout(()=>c.innerHTML='',4200)}
const AC=window.AudioContext||window.webkitAudioContext;let ac=null,mute=false;
const wake=()=>{try{if(!ac&&AC)ac=new AC();if(ac&&ac.state==='suspended')ac.resume()}catch(e){}};
const beep=(f,d,type,v,when)=>{if(mute||!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+(when||0);o.type=type||'square';o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.02)};
$('snd').onclick=()=>{mute=!mute;$('snd').setAttribute('aria-pressed',String(!mute))};
const openSheet=()=>{$('sheet').classList.add('open');$('sheet').setAttribute('aria-hidden','false')};
$('sclose').onclick=()=>{$('sheet').classList.remove('open');$('sheet').setAttribute('aria-hidden','true')};
let popT=null;
const hidePop=()=>{clearTimeout(popT);$('pop').classList.remove('show');$('pop').setAttribute('aria-hidden','true')};
const showPop=()=>{$('pop').classList.add('show');$('pop').setAttribute('aria-hidden','false');popT=setTimeout(hidePop,9000)};
$('pframe').onclick=hidePop;
let busy=false,locked=false;
const spin=(tt)=>{
  busy=true;wake();hidePop();$('result').textContent='';$('result').className='';
  $('machine').classList.remove('win');delete $('machine').dataset.hit;$('sheet').classList.remove('open');$('sheet').setAttribute('aria-hidden','true');$('mq').textContent='Wチャンス';
  $('machine').classList.add('shake');hop(true);say('いけー！','まわれー！');
  for(let k=0;k<12;k++)beep(200+k*25,.05,'square',.03,k*.045);
  const tick=setInterval(()=>beep(260+Math.random()*120,.03,'square',.02),90);
  const t=tt||pick();
  reels.forEach((r,i)=>{
    const dur=1800+i*700;
    const target=((t[i]-r.pos%3)+3)%3;
    r.pos=r.pos+3*(4+i*2)+target;
    r.s.classList.add('spin');
    place(r,r.pos+.16,true,dur);
    setTimeout(()=>{r.s.classList.remove('spin');place(r,r.pos,true,170);beep(120,.14,'sine',.16)},dur);
    setTimeout(()=>{r.pos=r.pos%3+6;place(r,r.pos,false)},dur+220);
  });
  setTimeout(()=>clearInterval(tick),1800+2*700);
  setTimeout(()=>{
    $('machine').classList.remove('shake');hop(false);
    const win=t[0]===t[1]&&t[1]===t[2],el=$('result'),m=$('machine');
    if(win&&t[0]===2){
      mugs();confetti();el.className='';el.innerHTML='';$('stitle').textContent='乾杯！';$('sprize').textContent=`${PRIZE[2][0]} ${PRIZE[2][1]}`;setTimeout(openSheet,1800);
      say('ごちそうさまです！','かんぱーい！');setTimeout(showPop,2600);$('mq').textContent='日髙の奢り！';
      m.dataset.hit=t[0];m.classList.add('win','flash');setTimeout(()=>m.classList.remove('flash'),2200);
      [1568,2093,1568,2093].forEach((f,k)=>beep(f,.3,'sine',.12,k*.16));
      [523,659,784,1047,784,1047,1319].forEach((f,k)=>beep(f,.16,'triangle',.08,.7+k*.11));
    }else if(win){
      confetti();el.className='';el.innerHTML='';say('やったー！','おめでとう！');$('stitle').textContent='大当たり！';$('sprize').textContent=`${PRIZE[t[0]][0]} ${PRIZE[t[0]][1]}`;setTimeout(openSheet,1100);
      m.dataset.hit=t[0];m.classList.add('win','flash');setTimeout(()=>m.classList.remove('flash'),2200);
      [523,659,784,1047,784,1047,1319].forEach((f,k)=>beep(f,.16,'triangle',.09,k*.11));
    }else{
      el.className='lose';el.innerHTML=`ざんねん…<small>またのチャレンジをお待ちしています</small>`;say('惜しい！','また来てね');
      [330,262].forEach((f,k)=>beep(f,.25,'sawtooth',.04,k*.18));
    }
    busy=false;
  },1800+2*700+450);
};
const lever=$('lever'),arm=$('arm'),pv=$('pv');
const setA=(a,anim)=>{arm.style.transition=anim?'transform .4s cubic-bezier(.3,1.5,.5,1)':'none';arm.style.transform=`rotate(${a}deg)`};
let drag=null;
const pull=()=>{if(busy||locked)return;wake();setA(170,true);beep(90,.12,'sine',.12);setTimeout(()=>setA(0,true),500);if(TOKEN)go();else spin()};
arm.addEventListener('pointerdown',e=>{if(busy||locked)return;wake();drag={a:0,moved:false};arm.setPointerCapture(e.pointerId);e.preventDefault()});
arm.addEventListener('pointermove',e=>{if(!drag)return;const r=pv.getBoundingClientRect();let a=Math.atan2(e.clientX-(r.left+r.width/2),-(e.clientY-(r.top+r.height/2)))*180/Math.PI;if(a<0)a=a<-120?170:0;a=Math.min(170,a);drag.a=a;if(a>8)drag.moved=true;setA(a,false)});
arm.addEventListener('pointerup',()=>{if(!drag)return;const d=drag;drag=null;if(d.a>100||!d.moved)pull();else setA(0,true)});
arm.addEventListener('pointercancel',()=>{drag=null;setA(0,true)});
arm.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pull()}});

/* ===== QRコード(トークン)モード ===== */
var TOKEN=new URLSearchParams(location.search).get('t');
const api=async a=>{const c=new AbortController(),to=setTimeout(()=>c.abort(),15000);
  try{const r=await fetch(`${CONFIG.GAS_URL}?action=${a}&t=${encodeURIComponent(TOKEN)}`,{signal:c.signal});return await r.json()}finally{clearTimeout(to)}};
const showErr=m=>{locked=true;busy=false;$('mq').textContent='Wチャンス';const el=$('result');el.className='lose';el.innerHTML=`<small>${m}</small>`};
const showUsed=rr=>{
  const t=rr.map(Number);reels.forEach((r,i)=>{r.pos=6+t[i];place(r,r.pos,false)});
  const win=t[0]===t[1]&&t[1]===t[2];locked=true;busy=false;$('mq').textContent='Wチャンス';
  $('stitle').textContent='使用済みです！';$('ssub').hidden=false;
  $('sprize').textContent=win?`${PRIZE[t[0]][0]} ${PRIZE[t[0]][1]}`:'結果：ハズレ';
  $('snote').hidden=!win;$('sshow').hidden=!win;
  if(win){$('machine').dataset.hit=t[0];$('machine').classList.add('win')}
  say('ご利用ありがとう！','また来てね');setTimeout(openSheet,500);
};
async function go(){
  busy=true;$('mq').textContent='通信中…';
  try{
    const r=await api('spin');
    if(!r.ok){showErr('このQRコードは無効です');return}
    if(r.status==='used'){showUsed(r.reels);return}
    spin(r.reels.map(Number));
  }catch(e){busy=false;$('mq').textContent='Wチャンス';const el=$('result');el.className='lose';el.innerHTML='<small>通信できませんでした。もう一度レバーを引いてください</small>'}
}
if(TOKEN){
  $('sclose').textContent='閉じる';
  if(!CONFIG.GAS_URL)showErr('設定が未完了です');
  else{busy=true;$('mq').textContent='確認中…';
    api('status').then(r=>{if(!r.ok)showErr('このQRコードは無効です');else if(r.status==='used')showUsed(r.reels);else{busy=false;$('mq').textContent='Wチャンス'}})
    .catch(()=>showErr('通信できませんでした。電波の良い場所でもう一度開いてください'));}
}
</script>
</body>
</html>
